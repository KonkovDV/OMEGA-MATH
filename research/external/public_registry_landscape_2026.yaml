adopted:
  - source-anchored identity, aliases, no merge on title resemblance
  - proposition nodes and record targets stay different objects
  - autonomy, evidence, and fidelity are independent grades
  - V3 requires a rebuild by someone other than the authors
  - same-party formally-checked stays at most an artifact-reported grade
  - sorryAx, extra axioms, and native_decide are named verdicts
  - a static source read is not a rebuild
  - object checks measure first and compare afterwards
  - sorry inside a statement library is not an open/solved status
  - a container that names many results speaks for none of them
  - supporting success and primary success are not added together
  - a pinned snapshot is not re-checked against a later library
  - a language-model fidelity note is not statement_fidelity faithful
  - a missing source feed stays missing

rejected:
  - closing an OMEGA entry from another registry's title
  - treating any snapshot count as a theorem count
  - adopting MathDB's advertised 2026 claims
  - moving an amenability axis because a project registered a result
  - replacing the human fidelity gate with Palomar's language-model filter
  - requiring an independent rebuild before formally-checked
